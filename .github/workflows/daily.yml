name: Daily LeetCode Practice
on:
  schedule:
    - cron: '30 14 * * *' # 20:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-leetcode-practice
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile-check C++ reference solutions
        run: python scripts/check_solutions.py
      - name: Generate practice sheet
        run: python scripts/daily.py
      - name: Export C++ reference files for manual review
        run: python scripts/export_cpp.py
      - name: Upload practice sheet
        uses: actions/upload-artifact@v6
        with:
          name: leetcode-practice
          path: |
            output/*.md
            output/cpp/*.cpp
          retention-days: 30
